<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Teste de Formulário</h1>

    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            Usuário:
            <input type="text" name="usu" id="iusu" required placeholder="Nome do usuário" size="15" minlength="6" maxlength="12" autocomplete="username">
        </p>

        <p>Senha:
            <input type="password" name="sen" id="isen" required placeholder="Senha atual" size="15" minlength="6" maxlength="12" autocomplete="current-password">
        </p>

        <p><input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        
    </form>
</body>
</html>
