<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            height: 400px;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
            width: 80px;
        }

        div#a {
            align-self: auto;
        }

        div#b {
            align-self: center;

        }

        div#c {
            align-self: flex-end;
        }

        div#d {

        }

        div#e {
            align-self: flex-end;

        }

        div#f {
            align-self: center;

        }

        div#g {
            align-self: stretch;
        }

    </style>

</head>
<body>
    <div class="conteiner">
        <div class="item" id="a">A</div>
        <div class="item" id="b">B</div>
        <div class="item" id="c">C</div>
        <div class="item" id="d">D</div>
        <div class="item" id="e">E</div>
        <div class="item" id="f">F</div>
        <div class="item" id="g">G</div>

    </div>
    
</body>
</html>
